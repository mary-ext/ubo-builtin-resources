name: update

on:
  schedule:
    # hourly, off the top of the hour
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: gorhill/uBlock branch or tag to extract from
        default: master
  push:
    paths:
      - scripts/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UBO_REF: ${{ inputs.ref || 'master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: clone gorhill/uBlock
        run: git clone --depth 1 --branch "$UBO_REF" https://github.com/gorhill/uBlock.git .ubo

      - name: extract scriptlets
        run: node scripts/extract.mjs --ubo .ubo --out dist

      - name: fetch previous release
        run: |
          mkdir -p prev
          gh release download --pattern scriptlets.json --pattern manifest.json --dir prev \
            || echo "no previous release"

      - name: compare
        id: compare
        run: |
          new=$(jq -r .sha256 dist/manifest.json)
          old=$(jq -r .sha256 prev/manifest.json 2>/dev/null || echo none)
          echo "old=$old new=$new"
          if [ "$new" = "$old" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          commit=$(jq -r .commit dist/manifest.json)
          {
            echo "extracted from gorhill/uBlock@[\`${commit:0:7}\`](https://github.com/gorhill/uBlock/commit/$commit)"
            echo
            node scripts/diff.mjs prev/scriptlets.json dist/scriptlets.json
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: publish release
        # only the default branch publishes; other branches just act as CI
        # (scheduled runs always run on the default branch)
        if: >-
          steps.compare.outputs.changed == 'true' &&
          (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
        run: |
          commit=$(jq -r .commit dist/manifest.json)
          tag="$(date -u +%Y%m%d-%H%M)-${commit:0:7}"
          gh release create "$tag" dist/scriptlets.json dist/manifest.json \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md \
            --latest
